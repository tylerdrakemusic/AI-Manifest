name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # CI runtime budget — bump as test suite grows (FR-20260425)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up paired Workspace revision
        run: python tools/resolve_workspace_revision.py

      - name: Export Workspace root for shared imports
        run: |
          echo "WORKSPACE_ROOT=${GITHUB_WORKSPACE}/workspace" >> $GITHUB_ENV
          echo "WORKSPACE_BACKUP_ENGINE_PATH=${GITHUB_WORKSPACE}/workspace/src/utils/database_backup.py" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Install pinned mypy for advisory checks
        run: |
          if python -m pip install mypy==1.18.2 >/dev/null 2>&1; then
            echo "Pinned mypy installed."
          else
            echo "mypy installation failed; advisory diagnostics will record the tool error." >&2
          fi

      - name: Run advisory mypy checks
        if: always()
        run: |
          python tools/mypy_advisory.py --ci || {
            echo "Advisory mypy runner failed; CI remains advisory." >&2
            exit 0
          }

      - name: Install pinned Ruff for advisory checks
        run: |
          if python -m pip install ruff==0.17.2 >/dev/null 2>&1; then
            echo "Pinned Ruff installed."
          else
            echo "Ruff installation failed; advisory checks may be unavailable." >&2
          fi

      - name: Run advisory Ruff checks
        if: always()
        run: |
          python tools/ruff_advisory.py --ci || {
            echo "Advisory Ruff runner failed; CI remains advisory." >&2
            exit 0
          }

      - name: Run tests in parallel
        env:
          PLAYWRIGHT_ENABLED: "0"  # Set to "1" locally to run Playwright tests (FR-20260513-playwright-ui-gate)
        run: |
          set -o pipefail
          echo "CI exclusion report: pytest will print skip reasons and summary counts"
          pytest --collect-only -q -o addopts= -m "not playwright and not live"
          python tools/run_tests.py --parallel --junitxml=tmp/pytest-junit.xml 2>&1 | tee pytest.log

      - name: Diagnose failed test run
        if: failure()
        run: |
          echo "=== pytest.log tail (redacted) ==="
          if [ -f pytest.log ]; then
            tail -n 80 pytest.log | sed -E 's/((token|secret|password|api[_-]?key|authorization)[[:space:]]*[:=][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig'
          else
            echo "pytest.log was not created"
          fi
          echo "=== JUnit summary ==="
          python -c 'import xml.etree.ElementTree as ET; from pathlib import Path; p=Path("tmp/pytest-junit.xml"); root=ET.parse(p).getroot() if p.exists() else None; print("missing report" if root is None else "tests={0} failures={1} errors={2} skipped={3}".format(root.attrib.get("tests", "0"), root.attrib.get("failures", "0"), root.attrib.get("errors", "0"), root.attrib.get("skipped", "0")))'

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: tmp/pytest-junit.xml

      - name: Upload sanitized advisory Ruff summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-advisory-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/ruff-advisory-ci/summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload sanitized advisory mypy summary
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-advisory-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/mypy-advisory-ci/**/summary.json
          if-no-files-found: warn
          retention-days: 30
