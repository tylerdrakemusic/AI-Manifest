name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # CI runtime budget — bump as test suite grows (FR-20260425)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check out Workspace repository
        uses: actions/checkout@v4
        with:
          repository: tylerdrakemusic/-Workspace
          ref: feature/FR-20260908-executive-brief-todo-execution-states
          path: workspace

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export Workspace root for shared imports
        run: |
          echo "WORKSPACE_ROOT=${GITHUB_WORKSPACE}/workspace" >> $GITHUB_ENV
          echo "WORKSPACE_BACKUP_ENGINE_PATH=${GITHUB_WORKSPACE}/workspace/src/utils/database_backup.py" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run tests in parallel
        env:
          PLAYWRIGHT_ENABLED: "0"  # Set to "1" locally to run Playwright tests (FR-20260513-playwright-ui-gate)
        run: |
          set -o pipefail
          echo "CI exclusion report: pytest will print skip reasons and summary counts"
          pytest --collect-only -q -o addopts= -m "not playwright and not live"
          python tools/run_tests.py --parallel --junitxml=tmp/pytest-junit.xml 2>&1 | tee pytest.log

      - name: Diagnose failed test run
        if: failure()
        run: |
          echo "=== pytest.log tail (redacted) ==="
          if [ -f pytest.log ]; then
            tail -n 80 pytest.log | sed -E 's/((token|secret|password|api[_-]?key|authorization)[[:space:]]*[:=][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig'
          else
            echo "pytest.log was not created"
          fi
          echo "=== JUnit summary ==="
          python -c 'import xml.etree.ElementTree as ET; from pathlib import Path; p=Path("tmp/pytest-junit.xml"); root=ET.parse(p).getroot() if p.exists() else None; print("missing report" if root is None else "tests={0} failures={1} errors={2} skipped={3}".format(root.attrib.get("tests", "0"), root.attrib.get("failures", "0"), root.attrib.get("errors", "0"), root.attrib.get("skipped", "0")))'

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: tmp/pytest-junit.xml
